- quote_de: "Peak Scale hat uns beim Aufbau unserer Data- und Analytics-Infrastruktur in der Cloud zielgerichtet und effizient unterstützt. Besonders wertvoll waren die klare, pragmatische Vorgehensweise und die Fähigkeit, komplexe Herausforderungen rasch in umsetzbare Lösungen zu übersetzen."
  quote_en: "Peak Scale provided focused and efficient support in building our data and analytics infrastructure in the cloud. We particularly valued their clear, pragmatic approach and their ability to turn complex challenges quickly into practical solutions."
  author_de: "Nik Wolfgram, Product Owner Data Mesh Team, die Mobiliar"
  author_en: "Nik Wolfgram, Product Owner, Data Mesh Team, die Mobiliar"

- quote_de: "Praxisnahe Architekturberatung und inspirierende Innovations-Workshops lieferten uns wertvolle Impulse für unsere technologische Weiterentwicklung. Die Zusammenarbeit war partnerschaftlich, professionell und fachlich sehr fundiert."
  quote_en: "Practical architecture advice and inspiring innovation workshops gave us valuable ideas for developing our technology further. The collaboration was collaborative, professional and technically very strong."
  author_de: "Cedric Bösiger, Solution Architecture Owner, PostFinance"
  author_en: "Cedric Bösiger, Solution Architecture Owner, PostFinance"

- quote_de: "Die gemeinsam aufgebaute cloud-native Plattform mit Talos, Kubernetes und GitOps hat unsere Infrastruktur nachhaltig modernisiert und den Weg für einen automatisierten, konsistenten Betrieb geebnet."
  quote_en: "The cloud-native platform we built together with Talos, Kubernetes and GitOps modernised our infrastructure for the long term. It created the foundation for automated, consistent operations."
  author_de: "Tobias Schmid, Leiter Softwareentwicklung, Energie Wasser Bern"
  author_en: "Tobias Schmid, Head of Software Development, Energie Wasser Bern"

- quote_de: "Die Workshops und Trainings von Peak Scale zu IT-Architektur und Automatisierung waren praxisnah und technisch auf sehr hohem Niveau. Besonders wertvoll waren die Fähigkeit, komplexe Inhalte verständlich zu vermitteln und direkt in anwendbare Lösungen zu übersetzen, sowie die sehr angenehme Art der Trainer. Wir würden Peak Scale jederzeit weiterempfehlen."
  quote_en: "Peak Scale's workshops and training courses on IT architecture and automation were practical and technically excellent. We particularly valued the trainers' ability to explain complex topics clearly and turn them directly into practical solutions, as well as their pleasant, engaging manner. We would gladly recommend Peak Scale."
  author_de: "René Zbinden, Verwaltungsrat, ACE"
  author_en: "René Zbinden, Member of the Board of Directors, ACE"
