- quote_de: "Peak Scale hat uns beim Aufbau der Data- und Analytics-Infrastruktur in der Cloud unserer Infrastruktur zielgerichtet und effizient unterstützt. Besonders wertvoll waren die klare, pragmatische Vorgehensweise und die Fähigkeit, komplexe Herausforderungen schnell in umsetzbare Lösungen zu übersetzen."
  quote_en: "Peak Scale supported us in building the data and analytics infrastructure in our cloud environment in a focused and efficient manner. Their clear, pragmatic approach and ability to rapidly translate complex challenges into actionable solutions were particularly valuable."
  author_de: "Nik Wolfgram, Product Owner Data Mesh Team, die Mobiliar"
  author_en: "Nik Wolfgram, Product Owner, Data Mesh Team, die Mobiliar"

- quote_de: "Praxisnahe Architekturberatung und inspirierende Innovations-Workshops haben uns wertvolle Impulse für unsere technologische Weiterentwicklung geliefert. Die Zusammenarbeit war, partnerschaftlich, professionell und von hoher fachlicher Qualität."
  quote_en: "Practical architecture consulting and inspiring innovation workshops gave us valuable impetus for our technological development. The collaboration was collaborative, professional and of outstanding technical quality."
  author_de: "Cedric Bösiger, Solution Architecture Owner, PostFinance"
  author_en: "Cedric Bösiger, Solution Architecture Owner, PostFinance"

- quote_de: "Die gemeinsam aufgebaute Cloud-Native Plattform mit Talos, Kubernetes und GitOps hat unsere Infrastruktur nachhaltig modernisiert und den Weg für eine automatisierte, konsistente Betriebsführung geebnet."
  quote_en: "The cloud-native platform we built together using Talos, Kubernetes and GitOps has sustainably modernised our infrastructure and paved the way for automated, consistent operations."
  author_de: "Tobias Schmid, Leiter Softwareentwicklung, Energie Wasser Bern"
  author_en: "Tobias Schmid, Head of Software Development, Energie Wasser Bern"

- quote_de: "Die Workshops und Trainings von Peak Scale zu IT-Architektur und Automatisierung waren praxisnah und technisch auf sehr hohem Niveau. Besonders wertvoll war einerseits die Fähigkeit, komplexe Inhalte verständlich zu vermitteln und direkt in anwendbare Lösungen zu übersetzen, und andererseits die sehr angenehme Art Ihrer Trainer. Wir würden sie jederzeit weiterempfehlen."
  quote_en: "Peak Scale's workshops and training on IT architecture and automation were hands-on and technically excellent. We particularly valued their ability to make complex topics easy to understand and translate them directly into applicable solutions, as well as their trainers' exceptionally pleasant manner. We would recommend them without hesitation."
  author_de: "René Zbinden, Verwaltungsrat, ACE"
  author_en: "René Zbinden, Member of the Board of Directors, ACE"
