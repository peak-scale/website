<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Section nav dots</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);display:flex;justify-content:center}.nav{display:flex;flex-direction:column;align-items:center;gap:14px}.eye{font-family:var(--font-ui);font-size:10px;letter-spacing:.1em;color:var(--brand);text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700}.dots{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}.dots::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border);transform:translateX(-.5px)}.d{width:8px;height:8px;border-radius:50%;background:rgba(165,171,183,.4);position:relative}.d.on{width:12px;height:12px;background:var(--brand);box-shadow:0 0 0 3px var(--bg)}</style>
</head><body>
<div class="nav">
<div class="eye">Architektur</div>
<div class="dots"><span class="d on"></span><span class="d"></span><span class="d"></span><span class="d"></span></div>
</div>
</body></html>
