<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Floating header</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.hdr{max-width:860px;margin:0 auto;border-radius:60px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);box-shadow:var(--shadow-float);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-faint)}.left{display:flex;align-items:center;gap:8px;font-weight:500;font-size:18px;color:var(--fg)}.nav{display:flex;gap:14px;align-items:center;font-size:14px;font-weight:500;color:var(--fg-muted)}.nav a{cursor:pointer}.nav a.on{color:var(--brand)}.lang{display:flex;background:var(--bg);border-radius:9999px;padding:2px}.lang button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:500;border-radius:9999px;cursor:pointer;color:var(--fg-muted);font-family:var(--font-sans)}.lang .on{background:#fff;color:var(--brand);box-shadow:var(--shadow-soft)}</style>
</head><body>
<div class="hdr">
<div class="left">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand)"><path d="M3 18 L10 6 L17 18"/><path d="M14 18 L18 12 L22 18"/><path d="M5 15 L10 8 L15 12 L19 10" stroke-width="1" stroke-dasharray="2 2"/><circle cx="5" cy="15" r="1.5" fill="currentColor" stroke="none"/></svg>
  Peak Scale
</div>
<div class="nav">
  <a class="on">Services</a>
  <span class="dot-square"></span>
  <a>Produkte</a>
  <span class="dot-square"></span>
  <a>Team</a>
</div>
<div class="lang"><button class="on">DE</button><button>EN</button></div>
</div>
<div style="margin-top:14px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle)">Nav items separated by 6px brand-blue squares rotated 45° (.dot-square)</div>
</body></html>
