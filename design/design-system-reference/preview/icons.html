<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:var(--font-sans)}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;text-align:center}.it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-white)}.it svg{stroke:var(--fg);stroke-width:2;width:24px;height:24px;fill:none;stroke-linecap:round;stroke-linejoin:round}.lab{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}</style>
</head><body>
<div class="row">
<div class="it"><svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><span class="lab">cloud</span></div>
<div class="it"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span class="lab">code</span></div>
<div class="it"><svg viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg><span class="lab">clipboard-check</span></div>
<div class="it"><svg viewBox="0 0 24 24"><path d="M21.42 10.92a1 1 0 0 0 0-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg><span class="lab">graduation-cap</span></div>
<div class="it"><svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span class="lab">mail</span></div>
<div class="it"><svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg><span class="lab">linkedin</span></div>
</div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);margin-top:14px">Lucide · stroke 2 · square caps · no fill</div>
</body></html>
