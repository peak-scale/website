<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spacing & radius</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);font-size:13px;color:var(--fg-muted)}.row{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}.b{background:var(--brand);border-radius:2px}.lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);text-align:center;margin-top:6px}.r{display:flex;gap:14px;align-items:center}.rsq{width:64px;height:64px;background:var(--bg-white);border:1px solid var(--border)}</style>
</head><body>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);margin-bottom:8px">SPACING SCALE (px)</div>
<div class="row">
<div><div class="b" style="width:4px;height:4px"></div><div class="lab">1·4</div></div>
<div><div class="b" style="width:8px;height:8px"></div><div class="lab">2·8</div></div>
<div><div class="b" style="width:16px;height:16px"></div><div class="lab">4·16</div></div>
<div><div class="b" style="width:24px;height:24px"></div><div class="lab">6·24</div></div>
<div><div class="b" style="width:32px;height:32px"></div><div class="lab">8·32</div></div>
<div><div class="b" style="width:48px;height:48px"></div><div class="lab">12·48</div></div>
<div><div class="b" style="width:64px;height:64px"></div><div class="lab">16·64</div></div>
<div><div class="b" style="width:96px;height:96px"></div><div class="lab">24·96</div></div>
<div><div class="b" style="width:120px;height:120px"></div><div class="lab">30·120</div></div>
</div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle);margin-bottom:8px">RADIUS</div>
<div class="r">
<div><div class="rsq" style="border-radius:4px"></div><div class="lab">sm·4</div></div>
<div><div class="rsq" style="border-radius:8px"></div><div class="lab">md·8</div></div>
<div><div class="rsq" style="border-radius:16px"></div><div class="lab">lg·16</div></div>
<div><div class="rsq" style="border-radius:24px"></div><div class="lab">xl·24</div></div>
<div><div class="rsq" style="border-radius:60px"></div><div class="lab">pill·60</div></div>
<div><div class="rsq" style="border-radius:9999px"></div><div class="lab">full</div></div>
</div>
</body></html>
