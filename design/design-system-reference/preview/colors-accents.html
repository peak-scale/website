<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colors — accents</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sw{border-radius:8px;border:1px solid var(--border);background:var(--bg-white);overflow:hidden}.sw .c{height:64px}.sw .m{padding:8px 10px;font-size:11px;font-family:var(--font-mono);color:var(--fg-muted)}.sw .n{font-size:12px;font-family:var(--font-sans);font-weight:500;color:var(--fg);display:block;margin-bottom:2px}</style>
</head><body>
<div class="row">
<div class="sw"><div class="c" style="background:rgb(144,202,125)"></div><div class="m"><span class="n">accent-sage</span>rgb(144,202,125)</div></div>
<div class="sw"><div class="c" style="background:rgb(233,247,224)"></div><div class="m"><span class="n">sage-soft</span>rgb(233,247,224)</div></div>
<div class="sw"><div class="c" style="background:rgb(184,169,120)"></div><div class="m"><span class="n">accent-gold</span>rgb(184,169,120)</div></div>
<div class="sw"><div class="c" style="background:rgb(248,243,188)"></div><div class="m"><span class="n">gold-soft</span>rgb(248,243,188)</div></div>
</div>
<div style="margin-top:14px;font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle)">Reserved for status pings, illustration / tag detail. Never as section backgrounds.</div>
</body></html>
