<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colors — primary</title>
<link rel="stylesheet" href="../colors_and_type.css?v=hifi2">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sw{border-radius:8px;border:1px solid var(--border);background:var(--bg-white);overflow:hidden}.sw .c{height:64px}.sw .m{padding:8px 10px;font-size:11px;font-family:var(--font-mono);color:var(--fg-muted)}.sw .n{font-size:12px;font-family:var(--font-sans);font-weight:500;color:var(--fg);display:block;margin-bottom:2px}</style>
</head><body>
<div class="row">
<div class="sw"><div class="c" style="background:rgb(240,248,252)"></div><div class="m"><span class="n">bg</span>rgb(240,248,252)</div></div>
<div class="sw"><div class="c" style="background:rgb(255,255,255);border-bottom:1px solid var(--border)"></div><div class="m"><span class="n">bg-white</span>rgb(255,255,255)</div></div>
<div class="sw"><div class="c" style="background:rgb(5,128,196)"></div><div class="m"><span class="n">brand</span>rgb(5,128,196)</div></div>
<div class="sw"><div class="c" style="background:rgb(26,69,156)"></div><div class="m"><span class="n">brand-deep</span>rgb(26,69,156)</div></div>
<div class="sw"><div class="c" style="background:rgb(9,24,54)"></div><div class="m"><span class="n">fg</span>rgb(9,24,54)</div></div>
<div class="sw"><div class="c" style="background:rgb(7,19,44)"></div><div class="m"><span class="n">fg-deep</span>rgb(7,19,44)</div></div>
<div class="sw"><div class="c" style="background:rgb(81,87,99)"></div><div class="m"><span class="n">fg-muted</span>rgb(81,87,99)</div></div>
<div class="sw"><div class="c" style="background:rgb(208,214,227)"></div><div class="m"><span class="n">border</span>rgb(208,214,227)</div></div>
</div>
</body></html>
