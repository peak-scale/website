{{- /* Quiet, consistent cross-links shared by all primary pages. */ -}}
<section class="section section--dark next-section">
  <div class="container">
    <div class="section__head section__head--left">
      <h2>{{ .title | safeHTML }}</h2>
    </div>
    <div class="next-steps">
      {{ range .cards }}
      <a class="next-steps__link" href="{{ .href | relLangURL }}">
        <span class="next-steps__eyebrow">{{ .eyebrow }}</span>
        <span class="next-steps__content">
          <span class="next-steps__title">{{ .title }}</span>
        {{ with .desc }}<p class="next-steps__desc">{{ . }}</p>{{ end }}
        </span>
        <span class="next-steps__arrow" aria-hidden="true">{{ partial "icon.html" (dict "name" "arrow-up-right" "size" 20) }}</span>
      </a>
      {{ end }}
    </div>
  </div>
</section>
