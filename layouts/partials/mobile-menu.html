<div class="mobile-menu" id="mobile-menu" data-menu hidden>
  <div class="mobile-menu__head">
    <a class="site-header__brand" href="{{ .Site.Home.RelPermalink }}">
      {{ partial "brand-mark.html" . }}
      Peak Scale
    </a>
    <button class="mobile-menu__close" type="button" aria-label="{{ i18n "menu_close" }}" data-menu-close>
      {{ partial "icon.html" "x" }}
    </button>
  </div>
  <ul class="mobile-menu__list reset">
    {{ range .Site.Menus.main -}}
    {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) -}}
    <li><a href="{{ .URL | relLangURL }}" {{ if $active }}class="is-active"{{ end }}>{{ .Name }}</a></li>
    {{- end }}
  </ul>
  <div class="mobile-menu__footer">
    <a class="btn btn--primary" href="mailto:{{ .Site.Params.contactEmail }}">{{ i18n "contact" }}</a>
    <div class="lang-switch" aria-label="{{ i18n "lang_switch" }}">
      {{ partial "lang-switch.html" . }}
    </div>
  </div>
</div>
