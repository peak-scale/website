<div class="hero-visual" aria-hidden="true">
  <svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="net-grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(5,128,196,.06)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="500" height="400" fill="url(#net-grid)"/>
    <circle cx="250" cy="200" r="160" fill="rgba(5,128,196,.04)"/>

    <!-- center node -->
    <g>
      <circle cx="250" cy="200" r="14" fill="var(--bright-blue)"/>
      <circle cx="250" cy="200" r="22" fill="none" stroke="rgba(5,128,196,.3)" stroke-width="1"/>
    </g>

    <!-- satellite nodes -->
    <g fill="var(--dark-blue)">
      <circle cx="120" cy="100" r="7"/>
      <circle cx="380" cy="120" r="7"/>
      <circle cx="100" cy="280" r="7"/>
      <circle cx="400" cy="280" r="7"/>
      <circle cx="250" cy="60" r="7"/>
      <circle cx="250" cy="350" r="7"/>
    </g>

    <!-- connections -->
    <g stroke="rgba(5,128,196,.45)" stroke-width="1.5">
      <line x1="120" y1="100" x2="250" y2="200"/>
      <line x1="380" y1="120" x2="250" y2="200"/>
      <line x1="100" y1="280" x2="250" y2="200"/>
      <line x1="400" y1="280" x2="250" y2="200"/>
      <line x1="250" y1="60" x2="250" y2="200"/>
      <line x1="250" y1="350" x2="250" y2="200"/>
    </g>

    <!-- inter-node thin lines -->
    <g stroke="rgba(165,171,183,.4)" stroke-width="1" stroke-dasharray="3 4">
      <line x1="120" y1="100" x2="250" y2="60"/>
      <line x1="250" y1="60" x2="380" y2="120"/>
      <line x1="100" y1="280" x2="250" y2="350"/>
      <line x1="250" y1="350" x2="400" y2="280"/>
    </g>
  </svg>
</div>
