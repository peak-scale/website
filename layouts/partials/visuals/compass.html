<div class="hero-visual" aria-hidden="true">
  <svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="compass-grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(5,128,196,.06)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="500" height="400" fill="url(#compass-grid)"/>
    <circle cx="250" cy="200" r="160" fill="none" stroke="rgba(5,128,196,.15)" stroke-width="1"/>
    <circle cx="250" cy="200" r="120" fill="none" stroke="rgba(5,128,196,.18)" stroke-width="1"/>
    <circle cx="250" cy="200" r="80" fill="rgba(5,128,196,.04)"/>

    <!-- compass needle -->
    <polygon points="250,80 268,200 250,200" fill="var(--brand)"/>
    <polygon points="250,320 232,200 250,200" fill="rgba(9,24,54,.55)"/>
    <circle cx="250" cy="200" r="6" fill="var(--fg)"/>
    <circle cx="250" cy="200" r="2" fill="#fff"/>

    <!-- cardinals -->
    <g font-family="var(--font-ui)" font-size="11" font-weight="700" letter-spacing="2"
       fill="var(--fg-muted)" text-anchor="middle">
      <text x="250" y="64">N</text>
      <text x="250" y="356">S</text>
      <text x="60" y="206">W</text>
      <text x="440" y="206">E</text>
    </g>

    <!-- ticks -->
    <g stroke="var(--border)" stroke-width="1">
      <line x1="250" y1="40" x2="250" y2="50"/>
      <line x1="250" y1="350" x2="250" y2="360"/>
      <line x1="40" y1="200" x2="50" y2="200"/>
      <line x1="450" y1="200" x2="460" y2="200"/>
    </g>

    <!-- diagonal route waypoints -->
    <circle cx="180" cy="130" r="3" fill="var(--brand)"/>
    <circle cx="320" cy="270" r="3" fill="var(--brand)"/>
    <path d="M180 130 Q 250 200 320 270" stroke="rgba(5,128,196,.4)" stroke-dasharray="3 4" fill="none"/>
  </svg>
</div>
