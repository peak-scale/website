<div class="hero-visual" aria-hidden="true">
  <svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="blocks-grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(5,128,196,.06)" stroke-width="1"/>
      </pattern>
      <linearGradient id="block-grad" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="rgba(5,128,196,.85)"/>
        <stop offset="100%" stop-color="rgba(26,69,156,.95)"/>
      </linearGradient>
    </defs>
    <rect width="500" height="400" fill="url(#blocks-grid)"/>

    <!-- isometric hex / cube cluster -->
    <g transform="translate(150,90)">
      <!-- Stack 1 -->
      <polygon points="0,40 60,10 120,40 60,70" fill="url(#block-grad)" opacity=".95"/>
      <polygon points="0,40 60,70 60,140 0,110" fill="rgba(9,24,54,.85)"/>
      <polygon points="60,70 120,40 120,110 60,140" fill="rgba(5,128,196,.65)"/>

      <!-- Stack 2 (right, taller) -->
      <polygon points="120,80 180,50 240,80 180,110" fill="url(#block-grad)" opacity=".9"/>
      <polygon points="120,80 180,110 180,220 120,190" fill="rgba(9,24,54,.85)"/>
      <polygon points="180,110 240,80 240,190 180,220" fill="rgba(5,128,196,.55)"/>

      <!-- Stack 3 (front, smaller) -->
      <polygon points="40,160 100,130 160,160 100,190" fill="url(#block-grad)" opacity=".95"/>
      <polygon points="40,160 100,190 100,250 40,220" fill="rgba(9,24,54,.9)"/>
      <polygon points="100,190 160,160 160,220 100,250" fill="rgba(5,128,196,.6)"/>

      <!-- Connectors -->
      <line x1="60" y1="105" x2="100" y2="160" stroke="var(--bright-blue)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="180" y1="170" x2="100" y2="200" stroke="var(--bright-blue)" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Sage accent dot -->
      <circle cx="60" cy="40" r="4" fill="var(--accent-green)"/>
      <circle cx="180" cy="80" r="4" fill="var(--accent-yellow)"/>
    </g>
  </svg>
</div>
