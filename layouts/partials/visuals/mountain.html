<svg class="mountain-stages__svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <linearGradient id="mt-sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(5,128,196,.08)"/>
      <stop offset="100%" stop-color="rgba(5,128,196,0)"/>
    </linearGradient>
    <linearGradient id="mt-warm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="rgba(184,169,120,.35)"/>
      <stop offset="100%" stop-color="rgba(184,169,120,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#mt-sky)"/>

  <!-- back ridges -->
  <path d="M0 280 L120 200 L220 240 L320 180 L440 220 L560 160 L680 210 L800 180 L800 360 L0 360 Z"
        fill="rgba(9,24,54,.06)"/>
  <path d="M0 300 L80 240 L180 270 L300 210 L400 250 L520 200 L640 240 L760 220 L800 230 L800 360 L0 360 Z"
        fill="rgba(9,24,54,.10)"/>

  <!-- Main summit (Architektur) -->
  <path d="M250 320 L420 60 L590 320 Z" fill="rgba(9,24,54,.85)"/>
  <!-- snow cap with warm accent -->
  <path d="M380 130 L420 60 L460 130 L440 150 L420 135 L400 150 Z" fill="#fff" opacity=".92"/>
  <path d="M390 120 L420 80 L450 120 L430 135 L420 130 L410 135 Z" fill="url(#mt-warm)"/>

  <!-- Secondary summit (Platform Engineering) -->
  <path d="M540 320 L640 160 L740 320 Z" fill="rgba(9,24,54,.7)"/>
  <path d="M620 200 L640 160 L660 200 L650 215 L640 205 L630 215 Z" fill="#fff" opacity=".85"/>

  <!-- Foothill (Assessments) -->
  <path d="M120 320 L220 200 L300 320 Z" fill="rgba(9,24,54,.55)"/>

  <!-- Camp / Training base -->
  <circle cx="160" cy="290" r="5" fill="var(--bright-blue)"/>
  <circle cx="160" cy="290" r="10" fill="rgba(5,128,196,.18)"/>

  <!-- Route line: basecamp → architecture summit -->
  <path d="M160 290 Q 220 250 260 240 T 360 180 T 420 60" fill="none" stroke="var(--bright-blue)"
        stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round"/>

  <!-- Route checkpoints -->
  <circle cx="220" cy="248" r="4" fill="var(--dark-blue)"/>
  <circle cx="320" cy="200" r="4" fill="var(--dark-blue)"/>
  <circle cx="420" cy="60" r="6" fill="var(--bright-blue)"/>

  <!-- Stage labels -->
  <g font-family="var(--font-ui)" font-size="11" font-weight="700" letter-spacing="1.5"
     fill="var(--bright-blue)" text-anchor="middle">
    <text x="160" y="278">BASECAMP</text>
    <text x="220" y="234">TRAINING</text>
    <text x="220" y="180" fill="var(--fg-muted)">ASSESSMENTS</text>
    <text x="640" y="148" fill="var(--fg-muted)">PLATFORM ENG.</text>
    <text x="420" y="48" fill="var(--bright-blue)">ARCHITEKTUR</text>
  </g>

  <!-- Horizon -->
  <line x1="0" y1="320" x2="800" y2="320" stroke="rgba(208,214,227,.6)" stroke-width="1"/>
</svg>
