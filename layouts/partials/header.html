<header class="site-header">
  <div class="site-header__pill">
    <a class="site-header__brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Peak Scale">
      <img src="/images/peakscale-logo.svg" alt="Peak Scale" width="124" height="44">
    </a>

    <nav class="site-header__nav" aria-label="Main">
      {{ range $i, $item := .Site.Menus.main -}}
      {{ if gt $i 0 }}<span class="dot-square" aria-hidden="true"></span>{{ end }}
      {{- $active := or ($.IsMenuCurrent "main" $item) ($.HasMenuCurrent "main" $item) -}}
      <a href="{{ $item.URL | relLangURL }}" {{ if $active }}class="is-active" aria-current="page"{{ end }}>{{ $item.Name }}</a>
      {{- end }}
    </nav>

    <div class="site-header__actions">
      <div class="lang-switch" aria-label="{{ i18n "lang_switch" }}">
        {{ partial "lang-switch.html" . }}
      </div>

      <button class="site-header__menu-toggle" type="button" aria-label="{{ i18n "menu_open" }}" data-menu-toggle>
        {{ partial "icon.html" "menu" }}
      </button>
    </div>
  </div>
</header>
